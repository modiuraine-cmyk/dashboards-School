<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بوابة مدرسة الأفق</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky header + branching tree sidebar (right, RTL) + content pane with breadcrumbs; drawer on phones */
:root {
  --paper: #f4f6fb;
  --surface: #ffffff;
  --sunk: #eaeef7;
  --ink: #15203a;
  --muted: #5a6681;
  --line: #d9dfec;
  --primary: #1f4e8c;
  --primary-ink: #ffffff;
  --accent: #f2b705;
  --accent-ink: #1d1600;
  --good: #1d7f53;
  --warn: #b26a00;
  --bad: #bb3029;
  --good-bg: #e2f4eb;
  --warn-bg: #fdf0d9;
  --bad-bg: #fbe5e3;
  --shadow: 0 1px 2px rgba(21,32,58,.06), 0 6px 20px rgba(21,32,58,.06);
  --f-display: "Reem Kufi", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1322; --surface: #151d31; --sunk: #1b2540; --ink: #e7ebf5; --muted: #9ba6c1; --line: #28334f;
    --primary: #79a6ff; --primary-ink: #0b1430; --accent: #f5c542; --accent-ink: #1d1600;
    --good: #5fd39c; --warn: #f0b048; --bad: #ff8a80; --good-bg: #133326; --warn-bg: #3a2a10; --bad-bg: #3d1a1a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1322; --surface: #151d31; --sunk: #1b2540; --ink: #e7ebf5; --muted: #9ba6c1; --line: #28334f;
  --primary: #79a6ff; --primary-ink: #0b1430; --accent: #f5c542; --accent-ink: #1d1600;
  --good: #5fd39c; --warn: #f0b048; --bad: #ff8a80; --good-bg: #133326; --warn-bg: #3a2a10; --bad-bg: #3d1a1a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.35; margin: 0; text-wrap: balance; font-weight: 700; }
h1 { font-size: clamp(1.6rem, 3.2vw, 2.3rem); }
h2 { font-size: 1.4rem; }
h3 { font-size: 1.1rem; }
p { margin: 0; }
a { color: var(--primary); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
main:focus, main:focus-visible { outline: none; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.eyebrow { font-size: .78rem; letter-spacing: .04em; color: var(--muted); font-weight: 600; }

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  display: flex; align-items: center; gap: 14px;
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.crest {
  width: 40px; height: 40px; flex: none; border-radius: 10px;
  background: var(--primary); color: var(--primary-ink);
  display: grid; place-items: center; font-family: var(--f-display); font-size: 1.3rem;
  position: relative; overflow: hidden;
}
.crest::after { content: ""; position: absolute; inset: auto 0 0 0; height: 7px; background: var(--accent); }
.brand b { font-family: var(--f-display); font-size: 1.1rem; display: block; line-height: 1.2; white-space: nowrap; }
.brand span { font-size: .75rem; color: var(--muted); display: block; white-space: nowrap; }
.search { flex: 1; max-width: 420px; margin-inline-start: auto; position: relative; }
.search input {
  width: 100%; padding: 8px 38px 8px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--sunk);
}
.search svg { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.results {
  position: absolute; inset-inline: 0; top: calc(100% + 6px); background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow);
  max-height: 60vh; overflow: auto; padding: 6px;
}
.results button { display: block; width: 100%; text-align: right; background: none; border: 0; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.results button:hover, .results button:focus-visible { background: var(--sunk); }
.results small { color: var(--muted); display: block; font-size: .75rem; }
.icon-btn {
  width: 40px; height: 40px; flex: none; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--ink);
}
.icon-btn:hover { background: var(--sunk); }
#menuBtn { display: none; }

/* Shell */
.shell { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: calc(100vh - 62px); }
.side {
  border-left: 1px solid var(--line); background: var(--surface);
  padding: 16px 12px 40px; position: sticky; top: calc(62px + env(safe-area-inset-top, 0px));
  height: calc(100vh - 62px - env(safe-area-inset-top, 0px)); overflow: auto;
}
.tree { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.tree ul { list-style: none; margin: 2px 0 6px; padding: 0 22px 0 0; border-right: 2px solid var(--line); margin-right: 19px; display: grid; gap: 1px; }
.node {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 8px 10px; border-radius: 8px; border: 0; background: none; cursor: pointer; text-align: right;
}
.node:hover { background: var(--sunk); }
.node .chev { margin-inline-start: auto; transition: transform .2s; color: var(--muted); }
.node[aria-expanded="true"] .chev { transform: rotate(-90deg); }
.node.on { background: var(--primary); color: var(--primary-ink); }
.node.on .chev { color: inherit; }
.leaf { padding: 5px 10px; font-size: .9rem; color: var(--muted); }
.leaf.on { background: var(--sunk); color: var(--ink); font-weight: 600; box-shadow: inset -3px 0 0 var(--accent); }
.side-foot { margin-top: 18px; padding: 12px; border-radius: var(--r); background: var(--sunk); font-size: .8rem; color: var(--muted); }

main {
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 60px; min-width: 0;
}
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 20px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .85rem; color: var(--muted); }
.crumbs button { background: none; border: 0; padding: 0; color: var(--primary); cursor: pointer; }
.crumbs i { font-style: normal; opacity: .6; }
.head { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; }
.head p { color: var(--muted); max-width: 65ch; }

/* Generic blocks */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.panel > h3 { margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.span2 { grid-column: span 2; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tab { border: 0; background: none; padding: 9px 14px; cursor: pointer; border-bottom: 3px solid transparent; color: var(--muted); font-weight: 600; }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.btn {
  border: 1px solid transparent; background: var(--primary); color: var(--primary-ink);
  padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; display: inline-flex; gap: 8px; align-items: center;
}
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.yellow { background: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 10px; border-radius: 999px; font-size: .78rem; font-weight: 600; white-space: nowrap; background: var(--sunk); color: var(--muted); }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.info { background: var(--sunk); color: var(--primary); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 14px; cursor: pointer; font-size: .85rem; }
.filters button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* Home */
.hero {
  border-radius: 14px; padding: 28px; display: grid; grid-template-columns: minmax(0,1.4fr) minmax(0,1fr); gap: 24px;
  background: var(--primary); color: var(--primary-ink); position: relative; overflow: hidden;
}
.hero::before {
  content: ""; position: absolute; inset: 0; opacity: .12; pointer-events: none;
  background-image: linear-gradient(var(--primary-ink) 1px, transparent 1px), linear-gradient(90deg, var(--primary-ink) 1px, transparent 1px);
  background-size: 28px 28px;
}
.hero > * { position: relative; }
.hero h1 { font-size: clamp(1.7rem, 3.6vw, 2.6rem); }
.hero p { opacity: .9; max-width: 52ch; margin-top: 8px; }
.hero .cta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.hero .btn.ghost { background: transparent; color: var(--primary-ink); border-color: currentColor; }
.today { background: var(--surface); color: var(--ink); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; align-content: start; }
.today li { display: flex; gap: 10px; align-items: baseline; }
.today ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: .9rem; }
.today time { font-weight: 700; color: var(--primary); min-width: 46px; }
.portal-tiles { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; }
.ptile {
  text-align: right; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r);
  padding: 16px; cursor: pointer; display: grid; gap: 6px; transition: transform .15s, border-color .15s;
}
.ptile:hover { transform: translateY(-2px); border-color: var(--primary); }
.ptile .ic { width: 40px; height: 40px; border-radius: 10px; background: var(--sunk); color: var(--primary); display: grid; place-items: center; }
.ptile b { font-family: var(--f-display); font-size: 1.05rem; }
.ptile span { font-size: .82rem; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.stat { padding: 16px 18px; border-left: 1px solid var(--line); }
.stat:last-child { border-left: 0; }
.stat b { font-family: var(--f-display); font-size: 1.8rem; display: block; line-height: 1.2; }
.stat span { font-size: .82rem; color: var(--muted); }

/* News */
.news-list { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
.ncard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; cursor: pointer; text-align: right; padding: 0; }
.ncard:hover { border-color: var(--primary); }
.ncard .art { height: 96px; display: grid; place-items: center; color: var(--primary-ink); }
.ncard .body { padding: 14px; display: grid; gap: 6px; }
.ncard h3 { font-size: 1rem; }
.ncard p { font-size: .87rem; color: var(--muted); }
.article { max-width: 70ch; display: grid; gap: 14px; }

/* Lists & tables */
.rows { list-style: none; margin: 0; padding: 0; }
.rows li { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.rows li:last-child { border-bottom: 0; }
.rows .grow { flex: 1; min-width: 0; }
.datebox { width: 48px; flex: none; text-align: center; border-radius: 8px; background: var(--sunk); padding: 4px 0; line-height: 1.2; }
.datebox b { display: block; font-family: var(--f-display); font-size: 1.2rem; }
.datebox span { font-size: .7rem; color: var(--muted); }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th, td { padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: .78rem; color: var(--muted); font-weight: 600; background: var(--sunk); }
td.num, th.num { text-align: left; }
.bar { height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden; min-width: 80px; }
.bar i { display: block; height: 100%; background: var(--primary); border-radius: 99px; }
.bar.good i { background: var(--good); } .bar.warn i { background: var(--warn); } .bar.bad i { background: var(--bad); }

/* Drill-down cards */
.drill { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.dcard { text-align: right; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 16px; cursor: pointer; display: grid; gap: 4px; }
.dcard:hover { border-color: var(--primary); }
.dcard b { font-family: var(--f-display); font-size: 1.05rem; }
.dcard span { font-size: .83rem; color: var(--muted); }
.dcard .go { color: var(--primary); font-size: .82rem; font-weight: 600; margin-top: 4px; }

/* Org chart */
.org { list-style: none; margin: 0; padding: 0; }
.org ul { list-style: none; margin: 0; padding-right: 26px; border-right: 2px dashed var(--line); margin-right: 14px; }
.org li { padding-top: 8px; }
.onode { display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; cursor: pointer; text-align: right; }
.onode:hover { border-color: var(--primary); }
.onode .tg { width: 18px; height: 18px; border-radius: 4px; background: var(--sunk); display: grid; place-items: center; font-size: .8rem; font-weight: 700; color: var(--primary); }
.onode small { color: var(--muted); }

/* Timetable */
.tt th, .tt td { text-align: center; }
.tt td { font-size: .82rem; }
.slot { display: block; border-radius: 6px; padding: 4px 6px; background: var(--sunk); }
.slot.now { background: var(--accent); color: var(--accent-ink); font-weight: 700; }

/* Attendance toggles */
.att { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
.att button { display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); cursor: pointer; text-align: right; }
.att button[data-s="p"] { border-color: var(--good); }
.att button[data-s="a"] { border-color: var(--bad); background: var(--bad-bg); }
.att button[data-s="l"] { border-color: var(--warn); background: var(--warn-bg); }

/* KPI */
.kpi { display: grid; gap: 4px; }
.kpi b { font-family: var(--f-display); font-size: 1.7rem; line-height: 1.2; }
.kpi .delta { font-size: .8rem; font-weight: 600; }
.up { color: var(--good); } .down { color: var(--bad); }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.chart .gridl { stroke: var(--line); stroke-width: 1; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-left: 5px; vertical-align: middle; }

/* Calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 4px; }
.cal .dow { font-size: .75rem; color: var(--muted); text-align: center; padding: 4px 0; font-weight: 600; }
.day { min-height: 76px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; background: var(--surface); text-align: right; cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.day.out { background: transparent; border-style: dashed; opacity: .45; cursor: default; }
.day.today { box-shadow: inset 0 0 0 2px var(--accent); }
.day.sel { border-color: var(--primary); background: var(--sunk); }
.day .d { font-size: .8rem; font-weight: 700; }
.dot { display: block; font-size: .68rem; border-radius: 4px; padding: 0 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fff; }
.c-exam { background: #b8452f; } .c-holiday { background: #2f7d57; } .c-activity { background: #3d63b8; } .c-meeting { background: #7a4fa6; }

/* Forms */
.form { display: grid; gap: 14px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: .85rem; font-weight: 600; }
.field input, .field select, .field textarea { padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); width: 100%; }
.field .err { color: var(--bad); font-size: .78rem; min-height: 1em; }
.field.bad input, .field.bad select { border-color: var(--bad); }
.steps { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; list-style: none; margin: 0; padding: 0; counter-reset: s; }
.steps li { counter-increment: s; display: flex; gap: 8px; align-items: center; font-size: .85rem; color: var(--muted); border-top: 4px solid var(--line); padding-top: 8px; }
.steps li::before { content: counter(s); width: 24px; height: 24px; flex: none; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; font-weight: 700; font-size: .8rem; }
.steps li.done { border-top-color: var(--good); color: var(--ink); }
.steps li.cur { border-top-color: var(--accent); color: var(--ink); font-weight: 600; }
.steps li.cur::before { background: var(--accent); color: var(--accent-ink); }
.notice { border-radius: var(--r); padding: 12px 14px; background: var(--warn-bg); color: var(--ink); font-size: .87rem; border-right: 4px solid var(--warn); }
.okbox { border-radius: var(--r); padding: 16px; background: var(--good-bg); border-right: 4px solid var(--good); }
.copyrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.copyrow code { background: var(--sunk); padding: 2px 8px; border-radius: 6px; user-select: all; direction: ltr; unicode-bidi: embed; }
.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; z-index: 50; font-size: .9rem; box-shadow: var(--shadow); }
.scrim { display: none; }
.demo-tag { font-size: .7rem; background: var(--accent); color: var(--accent-ink); padding: 0 8px; border-radius: 999px; font-weight: 700; }

@media (max-width: 1000px) {
  .portal-tiles, .g4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .news-list, .g3 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .stat:nth-child(2) { border-left: 0; }
  .stat:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
}
@media (max-width: 820px) {
  #menuBtn { display: grid; }
  .shell { grid-template-columns: minmax(0,1fr); }
  .side {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(300px, 86vw); height: auto; z-index: 40;
    padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
    transform: translateX(105%); transition: transform .25s; box-shadow: var(--shadow);
  }
  .side.open { transform: none; }
  .scrim.open { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 35; }
  .hero { grid-template-columns: minmax(0,1fr); padding: 20px; }
  .g2, .g3 { grid-template-columns: minmax(0,1fr); }
  .span2 { grid-column: auto; }
  .brand span { display: none; }
}
@media (max-width: 560px) {
  .news-list, .portal-tiles, .g4 { grid-template-columns: minmax(0,1fr); }
  .search { display: none; }
  .search.show { display: block; position: absolute; inset-inline: 12px; top: 100%; max-width: none; margin-top: 6px; }
  #searchBtn { display: grid; margin-inline-start: auto; }
  .steps { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .day { min-height: 52px; }
  .dot { font-size: 0; height: 6px; padding: 0; }
}
#searchBtn { display: none; }
@media (max-width: 560px) { #searchBtn { display: grid; } }

const TODAY = new Date(2026, 9, 24); // تاريخ مرجعي للعرض التجريبي

const store = {
  get(k, d) { try { const v = localStorage.getItem("ofoq:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("ofoq:" + k, JSON.stringify(v)); } catch (e) {} }
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const AR_MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const fmtDate = iso => { const [y, m, d] = iso.split("-").map(Number); return `${d} ${AR_MONTHS[m - 1]} ${y}`; };
const parseISO = iso => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

function go(view, sub = null, path = []) {
  S.view = view; S.sub = sub; S.path = path;
  if (NAV.find(n => n.id === view)?.kids) S.open.add(view);
  try { history.replaceState(null, "", "#" + (sub ? view + "-" + sub : view)); } catch (e) {}
  store.set("last", { view, sub });
  closeDrawer(); renderTree(); render();
  $("#main").focus({ preventScroll: true }); window.scrollTo({ top: 0 });
}

function renderTree() {
  $("#tree").innerHTML = NAV.map(n => {
    const active = S.view === n.id;
    const exp = n.kids && S.open.has(n.id);
    return `<li>
      <button class="node ${active && !S.sub ? "on" : ""}" data-node="${n.id}" ${n.kids ? `aria-expanded="${exp}"` : ""}>
        ${ic(n.id)}<span>${n.label}</span>
        ${n.kids ? `<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg>` : ""}
      </button>
      ${exp ? `<ul>${n.kids.map(([k, l]) => `<li><button class="node leaf ${active && S.sub === k ? "on" : ""}" data-leaf="${n.id}:${k}">${l}</button></li>`).join("")}</ul>` : ""}
    </li>`;
  }).join("");
}
$("#tree").addEventListener("click", e => {
  const leaf = e.target.closest("[data-leaf]");
  if (leaf) { const [v, s] = leaf.dataset.leaf.split(":"); S.pTab = null; return go(v, s); }
  const node = e.target.closest("[data-node]");
  if (!node) return;
  S.pTab = null;
  const n = NAV.find(x => x.id === node.dataset.node);
  if (n.kids) {
    if (S.view === n.id && !S.sub && S.open.has(n.id)) { S.open.delete(n.id); renderTree(); return; }
    S.open.add(n.id);
  }
  go(n.id);
});

function crumbs(extra = []) {
  const items = [["home", null, [], "الرئيسية"]];
  if (S.view !== "home") items.push([S.view, null, [], TITLES[S.view]]);
  if (S.sub) items.push([S.view, S.sub, [], TITLES[S.view + ":" + S.sub]]);
  extra.forEach(x => items.push(x));
  return `<nav class="crumbs" aria-label="مسار التنقل">${items.map((it, i) => i === items.length - 1
    ? `<span aria-current="page">${it[3]}</span>`
    : `<button data-crumb='${esc(JSON.stringify(it.slice(0, 3)))}'>${it[3]}</button><i>‹</i>`).join("")}</nav>`;
}
function header(title, desc, actions = "") {
  return `<div class="head"><div><h1>${title}</h1>${desc ? `<p>${desc}</p>` : ""}</div>${actions}</div>`;
}

function orgNode(n, key, depth) {
  const hasKids = n.k && n.k.length;
  S.orgOpen = S.orgOpen || new Set(["r"]);
  const open = S.orgOpen.has(key);
  return `<li><button class="onode" data-org="${key}" ${hasKids ? `aria-expanded="${open}"` : ""}>${hasKids ? `<span class="tg">${open ? "−" : "+"}</span>` : ""}<span><b>${n.n}</b> <small>· ${n.p}</small></span></button>
    ${hasKids && open ? `<ul>${n.k.map((c, i) => orgNode(c, key + "." + i, depth + 1)).join("")}</ul>` : ""}</li>`;
}

function qualityPanel(admin) {
  const rows = SUPERVISORS.map(([n, dept, done, tot, upd]) => {
    const pct = Math.round(done / tot * 100);
    const st = pct === 100 ? ["good", "مكتمل"] : pct >= 60 ? ["warn", "قيد الإنجاز"] : ["bad", "متأخر"];
    return { n, dept, done, tot, upd, pct, st };
  });
  const filt = S.qFilter || "all";
  const shown = rows.filter(r => filt === "all" || r.st[0] === filt);
  const avg = Math.round(rows.reduce((a, r) => a + r.pct, 0) / rows.length);
  const sel = rows.find(r => r.n === S.qSel);
  return `
    <div class="grid g4">
      <div class="panel kpi"><span class="eyebrow">متوسط اكتمال الملفات</span><b class="num">${avg}٪</b><div class="bar"><i style="width:${avg}%"></i></div></div>
      <div class="panel kpi"><span class="eyebrow">ملفات مكتملة</span><b class="num up">${rows.filter(r => r.st[0] === "good").length}</b><span class="small muted">من ${rows.length}</span></div>
      <div class="panel kpi"><span class="eyebrow">قيد الإنجاز</span><b class="num" style="color:var(--warn)">${rows.filter(r => r.st[0] === "warn").length}</b></div>
      <div class="panel kpi"><span class="eyebrow">متأخرة (أقل من 60٪)</span><b class="num down">${rows.filter(r => r.st[0] === "bad").length}</b></div>
    </div>
    <div class="panel">
      <div class="head" style="margin-bottom:10px"><h3>متابعة ملفات المشرفات</h3>
        <div class="filters">${[["all","الكل"],["good","مكتمل"],["warn","قيد الإنجاز"],["bad","متأخر"]].map(([k, l]) => `<button class="${k === filt ? "on" : ""}" data-qf="${k}">${l}</button>`).join("")}</div></div>
      <div class="tbl-wrap"><table><thead><tr><th>المشرفة</th><th>المجال</th><th class="num">المنجز</th><th>نسبة الاكتمال</th><th>الحالة</th><th>آخر تحديث</th></tr></thead><tbody>
      ${shown.map(r => `<tr><td><button style="all:unset;cursor:pointer;color:var(--primary);font-weight:600" data-qs="${r.n}">${r.n}</button></td><td>${r.dept}</td><td class="num">${r.done} / ${r.tot}</td><td><div class="bar ${r.st[0]}"><i style="width:${r.pct}%"></i></div></td><td><span class="chip ${r.st[0]}">${r.st[1]}</span></td><td class="num small">${fmtDate(r.upd)}</td></tr>`).join("")}
      </tbody></table></div>
      ${sel ? `<div class="panel" style="margin-top:14px;background:var(--sunk)"><h3>مكونات ملف ${sel.n} — ${sel.dept}</h3>
        <div class="grid g4">${QFILES.map((f, i) => `<div class="small" style="display:flex;gap:6px;align-items:center"><span class="chip ${i < sel.done ? "good" : "bad"}">${i < sel.done ? "✓" : "—"}</span>${f}</div>`).join("")}</div></div>`

/* ---------------- الرسوم البيانية (SVG) ---------------- */
function barChart(data) {
  const W = 480, H = 220, L = 44, R = 10, T = 16, B = 28;
  const max = 1400, ticks = [0, 350, 700, 1050, 1400];
  const y = v => T + (H - T - B) * (1 - v / max);
  const bw = (W - L - R) / data.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="أعداد الطلاب من ${data[0][0]} إلى ${data[data.length - 1][0]}">
    ${ticks.map(t => `<line class="gridl" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${t.toLocaleString("en")}</text>`).join("")}
    ${data.map(([k, v], i) => { const x = L + i * bw + bw * .2, w = bw * .6, last = i === data.length - 1; return `<rect x="${x}" y="${y(v)}" width="${w}" height="${y(0) - y(v)}" rx="4" fill="${last ? "var(--primary)" : "var(--line)"}"><title>${k}: ${v}</title></rect><text x="${x + w / 2}" y="${y(v) - 5}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${v.toLocaleString("en")}</text><text x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${k}</text>`; }).join("")}
  </svg>`;
}
function lineChart(data) {
  const W = 480, H = 220, L = 40, R = 14, T = 14, B = 28, lo = 90, hi = 98;
  const ticks = [90, 92, 94, 96, 98];
  const x = i => L + i * (W - L - R) / (data.length - 1);
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const pts = k => data.map((d, i) => `${x(i)},${y(d[k])}`).join(" ");
  const area = `${x(0)},${y(lo)} ${pts(1)} ${x(data.length - 1)},${y(lo)}`;
  const last = data[data.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="نسبة الحضور الأسبوعية مقابل المستهدف">
    ${ticks.map(t => `<line class="gridl" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${t}٪</text>`).join("")}
    ${data.map((d, i) => i % 2 === 0 ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${i + 1}</text>` : "").join("")}
    <polygon points="${area}" fill="var(--primary)" opacity=".12"/>
    <polyline points="${pts(2)}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 4"/>
    <polyline points="${pts(1)}" fill="none" stroke="var(--primary)" stroke-width="2.5"/>
    <circle cx="${x(data.length - 1)}" cy="${y(last[1])}" r="5" fill="var(--primary)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${x(data.length - 1) - 8}" y="${y(last[1]) + 18}" text-anchor="end" style="fill:var(--ink);font-weight:600">${last[1]}٪</text>
  </svg><p class="small muted">الأسابيع 1–8 من الفصل الأول</p>`;
}

  const st = S.adm = S.adm || store.get("adm", { step: 0, data: {} });
  if (st.done) return header("القبول والتسجيل", "") + `<div class="okbox"><h2>تم حفظ طلب التسجيل</h2><p style="margin-top:6px">رقم الطلب المرجعي: <b class="num">${st.done}</b></p><p class="small" style="margin-top:6px">هذه نسخة عرض: الطلب محفوظ في متصفحك فقط. عند ربط الواجهة بنظام المدرسة يصل الطلب إلى لجنة القبول ويُرسل إشعار إلى ولي الأمر.</p><button class="btn ghost" data-act="adm-reset" style="margin-top:12px">بدء طلب جديد</button></div>`;
  const step = st.step;
  let body;
  if (step < 3) body = `<div class="grid g2">${ADM_FIELDS[step].map(f => fieldHTML(f, st.data[f[0]])).join("")}</div>`;
  else body = `<div class="grid g3">${ADM_FIELDS.map((grp, gi) => `<div class="panel" style="background:var(--sunk)"><div class="head" style="margin-bottom:6px"><h3>${ADM_STEPS[gi]}</h3><button class="btn ghost" data-admstep="${gi}" type="button">تعديل</button></div><ul class="rows">${grp.filter(f => f[2] !== "file").map(f => `<li><span class="grow small muted">${f[1]}</span><span class="small">${esc(st.data[f[0]] || "—")}</span></li>`).join("")}</ul></div>`).join("")}</div>
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="a_agree"> أقر بصحة البيانات والاطلاع على لائحة القبول.</label>`;
  return header("القبول والتسجيل", "قدّم طلب التسجيل للعام الدراسي القادم في أربع خطوات. تُحفظ مسودتك تلقائيًا في هذا المتصفح.") +
    `<ol class="steps">${ADM_STEPS.map((s, i) => `<li class="${i < step ? "done" : i === step ? "cur" : ""}">${s}</li>`).join("")}</ol>
    <form class="panel form" id="admForm" novalidate>
      <h2>${ADM_STEPS[step]}</h2>${body}
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        ${step > 0 ? `<button class="btn ghost" type="button" data-act="adm-back">→ السابق</button>` : ""}
        <button class="btn ${step === 3 ? "yellow" : ""}" type="submit">${step === 3 ? "إرسال الطلب" : "التالي ←"}</button>
      </div>
    </form>
    <div class="notice">شروط القبول العامة: إكمال 6 سنوات للصف الأول بنهاية العام الدراسي، وإحضار أصل شهادة آخر صف، وسجل التطعيمات للمرحلة الابتدائية.</div>`;
}
function fieldHTML([id, label, type, req, , , opts], val = "") {
  const v = esc(val || "");
  const r = req ? " *" : "";
  let input;
  if (type === "select") input = `<select id="${id}">${opts.map(o => `<option value="${esc(o)}" ${o === val ? "selected" : ""}>${o || "اختر…"}</option>`).join("")}</select>`;
  else if (type === "textarea") input = `<textarea id="${id}" rows="3">${v}</textarea>`;
  else if (type === "file") input = `<input id="${id}" type="file" multiple accept=".pdf,image/*">`;
  else input = `<input id="${id}" type="${type}" value="${v}" ${type === "tel" ? 'inputmode="numeric" dir="ltr"' : ""}>`;
  return `<div class="field ${type === "textarea" ? "span2" : ""}"><label for="${id}">${label}${r}</label>${input}<span class="err"></span></div>`;
}

/* ============================================================
   الرسم والأحداث العامة
   ============================================================ */
function render() {
  $("#view").innerHTML = PAGES[S.view]();
  document.title = (S.sub ? TITLES[S.view + ":" + S.sub] : TITLES[S.view]) + " · " + SCHOOL.name;
}

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); }

document.addEventListener("click", e => {
  const t = e.target.closest("button, a"); if (!t) return;
  const d = t.dataset;
  if (d.go) { e.preventDefault(); const [v, s] = d.go.split(":"); S.pTab = null; return go(v, s || null); }
  if (d.crumb) { const [v, s, p] = JSON.parse(d.crumb); if (v) { S.pTab = null; return go(v, s, p || []); } return; }
  if (d.path) return go(S.view, S.sub, JSON.parse(d.path));
  if (d.news) return go("news", null, [d.news]);
  if (d.cat) { S.newsCat = d.cat; return render(); }
  if (d.calm != null) { const n = +d.calm; if (n === 0) { S.calMonth = null; S.calSel = iso(TODAY); } else { const [y, m] = S.calMonth || [TODAY.getFullYear(), TODAY.getMonth()]; const nd = new Date(y, m + n, 1); S.calMonth = [nd.getFullYear(), nd.getMonth()]; } return render(); }
  if (d.day) { S.calSel = d.day; return render(); }
  if (d.calf) { S.calFilter = d.calf; return render(); }
  if (d.org) { S.orgOpen.has(d.org) ? S.orgOpen.delete(d.org) : S.orgOpen.add(d.org); return render(); }
  if (d.qf) { S.qFilter = d.qf; return render(); }
  if (d.qs) { S.qSel = S.qSel === d.qs ? null : d.qs; return render(); }
  if (d.ptab) { S.pTab = d.ptab; return render(); }
  if (d.child) { S.child = +d.child; S.leaveSent = null; return render(); }
  if (d.cls) { S.cls = +d.cls; return render(); }
  if (d.att) { const k = "c" + (S.cls ?? 0); const cur = S.att[k][d.att]; S.att[k][d.att] = { p: "a", a: "l", l: "p" }[cur]; return render(); }
  if (d.copy) { const v = d.copy; navigator.clipboard?.writeText(v).then(() => toast("تم النسخ: " + v), () => toast("حدّد النص وانسخه يدويًا")); return; }
  if (d.admstep) { S.adm.step = +d.admstep; store.set("adm", S.adm); return render(); }
  if (d.act) {
    const a = d.act;
    if (a === "att-save") toast("تم اعتماد تحضير " + CLASSES[S.cls ?? 0][0]);
    if (a === "att-all") { const k = "c" + (S.cls ?? 0); ROSTER.forEach(n => S.att[k][n] = "p"); render(); }
    if (a === "leave-new") { S.leaveSent = null; render(); }
    if (a === "adm-back") { collectAdm(); S.adm.step--; store.set("adm", S.adm); render(); }
    if (a === "adm-reset") { S.adm = { step: 0, data: {} }; store.set("adm", S.adm); render(); }
  }
});

document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.gb) {
    const max = el.dataset.i === "0" ? 20 : 30;
    const v = Math.max(0, Math.min(max, Number(el.value) || 0));
    S.gb[el.dataset.gb][+el.dataset.i] = v;
    clearTimeout(document.gbT); document.gbT = setTimeout(() => { const id = el.getAttribute("aria-label"); render(); const n = document.querySelector(`[aria-label="${id}"]`); n && n.focus(); }, 500);
  }
  if (el.id && el.id.startsWith("a_") && S.adm && el.type !== "file" && el.type !== "checkbox") { S.adm.data[el.id] = el.value; store.set("adm", S.adm); }
});

function collectAdm() {
  if (S.adm.step > 2) return;
  ADM_FIELDS[S.adm.step].forEach(([id, , type]) => { const el = document.getElementById(id); if (el && type !== "file") S.adm.data[id] = el.value.trim(); });
}
function setErr(id, msg) { const f = document.getElementById(id).closest(".field"); f.classList.toggle("bad", !!msg); f.querySelector(".err").textContent = msg || ""; return !msg; }

document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "admForm") {
    const st = S.adm;
    if (st.step < 3) {
      collectAdm();
      let ok = true;
      ADM_FIELDS[st.step].forEach(([id, , type, req, re, reMsg]) => {
        if (type === "file") return;
        const v = st.data[id] || "";
        let m = "";
        if (req && !v) m = "هذا الحقل مطلوب";
        else if (v && re && !re.test(v)) m = reMsg;
        if (!setErr(id, m)) ok = false;
      });
      if (!ok) { f.querySelector(".bad input, .bad select")?.focus(); return; }
      st.step++; store.set("adm", st); render();
    } else {
      if (!document.getElementById("a_agree").checked) return toast("فضلًا أكّد الإقرار قبل الإرسال");
      st.done = "ADM-" + (1448) + "-" + String(Math.floor(1000 + Math.random() * 9000));
      store.set("adm", st); render();
    }
  }
  if (f.id === "contactForm") {
    const a = setErr("c_name", document.getElementById("c_name").value.trim() ? "" : "اكتب اسمك");
    const b = setErr("c_msg", document.getElementById("c_msg").value.trim().length >= 10 ? "" : "اكتب رسالة من 10 أحرف على الأقل");
    if (a && b) { f.reset(); toast("حُفظت رسالتك في المعاينة — اربط النموذج بخادم المدرسة لإرسالها"); }
  }
  if (f.id === "leaveForm") {
    const ok = setErr("l_reason", document.getElementById("l_reason").value.trim() ? "" : "اذكر سبب الطلب");
    if (ok) { S.leaveSent = "LV-" + Math.floor(10000 + Math.random() * 89999); render(); }
  }
});

/* ---------------- البحث ---------------- */
const INDEX = [
  ...NAV.flatMap(n => [{ t: n.label, s: "صفحة", go: [n.id, null, []] }, ...(n.kids || []).map(([k, l]) => ({ t: l, s: n.label, go: [n.id, k, []] }))]),
  ...NEWS.map(n => ({ t: n.title, s: "خبر · " + fmtDate(n.date), go: ["news", null, [n.id]], x: n.body.join(" ") })),
  ...STAGES.flatMap(st => st.grades.map(g => ({ t: GRADE_NAMES[g], s: st.name, go: ["academics", st.id, [g]] }))),
  ...Object.entries(SUBJECTS).flatMap(([sid, list]) => list.map(([n]) => ({ t: n, s: "مادة · " + STAGES.find(s => s.id === sid).name, go: ["academics", sid, []] }))),
  ...EVENTS.map(e => ({ t: e.t, s: "حدث · " + fmtDate(e.d), go: ["calendar", null, []], day: e.d })),
  { t: "متابعة ملفات المشرفات", s: "لوحة الإدارة · الجودة", go: ["portals", "admin", []], tab: "quality" }
];
const norm = s => s.replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").replace(/[ً-ْ]/g, "").toLowerCase();
$("#q").addEventListener("input", e => {
  const q = norm(e.target.value.trim());
  const box = $("#results");
  if (q.length < 2) { box.hidden = true; return; }
  const hits = INDEX.filter(i => norm(i.t + " " + (i.x || "")).includes(q)).slice(0, 8);
  box.innerHTML = hits.length ? hits.map((h, i) => `<button data-hit="${INDEX.indexOf(h)}">${esc(h.t)}<small>${esc(h.s)}</small></button>`).join("") : `<p class="small muted" style="padding:8px">لا نتائج لـ «${esc(e.target.value)}». جرّب كلمة أخرى مثل «اختبارات» أو «الرياضيات».</p>`;
  box.hidden = false;
});
$("#results").addEventListener("click", e => {
  const b = e.target.closest("[data-hit]"); if (!b) return;
  e.stopPropagation();
  const h = INDEX[+b.dataset.hit];
  $("#results").hidden = true; $("#q").value = ""; $("#searchBox").classList.remove("show");
  if (h.day) { const d = parseISO(h.day); S.calMonth = [d.getFullYear(), d.getMonth()]; S.calSel = h.day; }
  S.pTab = h.tab || null;
  go(...h.go);
});
document.addEventListener("click", e => { if (!e.target.closest("#searchBox") && !e.target.closest("#searchBtn")) $("#results").hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") { $("#results").hidden = true; closeDrawer(); } });
$("#searchBtn").addEventListener("click", () => { $("#searchBox").classList.toggle("show"); $("#q").focus(); });

/* ---------------- القائمة الجانبية والمظهر ---------------- */
function closeDrawer() { $("#side").classList.remove("open"); $("#scrim").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded", "false"); }
$("#menuBtn").addEventListener("click", () => { const o = $("#side").classList.toggle("open"); $("#scrim").classList.toggle("open", o); $("#menuBtn").setAttribute("aria-expanded", String(o)); });
$("#scrim").addEventListener("click", closeDrawer);
$("#themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next; store.set("theme", next);
});

/* ---------------- الإقلاع ---------------- */
(function boot() {
  $("#schoolName").textContent = SCHOOL.name; $("#schoolMotto").textContent = SCHOOL.motto;
  const th = store.get("theme", null); if (th) document.documentElement.dataset.theme = th;
  const h = (location.hash || "").slice(1);
  let v = "home", s = null;
  if (h) { const [a, b] = h.split("-"); if (PAGES[a]) { v = a; s = b && TITLES[a + ":" + b] ? b : null; } }
  go(v, s);
})();
</script>
</body>
</html>
